[project]
name = "crea-zik"
version = "0.1.0"
description = "Offline procedural audio studio"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.116,<1",
    "jsonschema>=4.23,<5",
    "numpy>=2.2,<3",
    "pydantic>=2.11,<3",
    "scipy>=1.15,<2",
    "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
    "coverage[toml]>=7.6,<8",
    "httpx2>=2.9,<3",
    "hypothesis>=6.112,<7",
    "mypy>=1.13,<2",
    "mutmut>=3.2,<4",
    "pytest>=8.4,<9",
    "pytest-cov>=6.0,<7",
    "ruff>=0.9,<1",
    "schemathesis>=3.32,<4",
]

[project.scripts]
crea-zik = "crea_zik.cli:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/crea_zik"]

[tool.pytest.ini_options]
pythonpath = ["backend/src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["backend/src/crea_zik"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.mypy]
python_version = "3.13"
files = ["backend/src/crea_zik"]
check_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
