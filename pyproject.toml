[project]
name = "crea-zik"
version = "0.1.0"
description = "Offline procedural audio studio"
requires-python = ">=3.13"
dependencies = ["fastapi>=0.116,<1", "pydantic>=2.11,<3", "uvicorn>=0.35,<1"]

[dependency-groups]
dev = ["httpx2>=2.9,<3", "pytest>=8.4,<9"]

[project.scripts]
crea-zik = "crea_zik.cli:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/crea_zik"]

[tool.pytest.ini_options]
pythonpath = ["backend/src"]
testpaths = ["tests"]
